name: Build IParrot

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Publicar release com esta versão (ex.: v0.1.0). Em branco, só compila.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

# Sobre `retention-days: 1` nos artefatos abaixo: a conta tem 500 MB de
# armazenamento de artefatos, e uma execução completa gera ~240 MB. Com a
# retenção padrão (90 dias) ou mesmo 7, duas execuções enchem a cota e o
# GitHub passa a recusar o início dos jobs — a falha aparece como um job que
# termina em segundos, sem nenhum passo executado e sem log. Os artefatos aqui
# só existem para o job de release baixá-los na mesma execução, então um dia é
# mais do que suficiente. Os anexos de release não entram nessa cota.

jobs:
  ui:
    name: Interface (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui

  linux:
    name: Linux (desktop + daemon)
    runs-on: ubuntu-24.04
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Bibliotecas do WebView
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: make deps tools
      - name: Testes do núcleo
        run: go test -tags "fts5 sqlite sqlite_unlock_notify" ./core/... ./ui/...
      - run: make desktop-linux
      - run: make daemon
      - name: Empacotar
        run: |
          mkdir -p dist/iparrot-linux-amd64
          cp build/bin/iparrot build/bin/iparrotd build/linux/iparrot.desktop build/appicon.png dist/iparrot-linux-amd64/
          tar -C dist -czf iparrot-linux-amd64.tar.gz iparrot-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: iparrot-linux-amd64
          path: iparrot-linux-amd64.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: go-sum
          path: go.sum
          retention-days: 1

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Conferir compilador C (MinGW)
        shell: bash
        run: gcc --version
      # No Windows os comandos vão direto (sem make), equivalentes a `make deps tools desktop-windows`.
      - name: Dependências Go e CLI do Wails
        shell: bash
        run: |
          go mod tidy
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Interface
        shell: bash
        working-directory: ui
        run: npm ci && npm run build
      - name: IParrot.exe
        shell: bash
        run: wails build -s -skipbindings -platform windows/amd64 -tags "fts5 sqlite sqlite_unlock_notify" -ldflags "-checklinkname=0" -webview2 embed -o IParrot.exe
      - uses: actions/upload-artifact@v4
        with:
          name: iparrot-windows-amd64
          path: build/bin/IParrot.exe
          retention-days: 1

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            mobile/package-lock.json
      # Os dois JDKs, porque as duas ferramentas discordam: o gomobile gera o
      # .aar chamando `javac -source 1.7`, que o 21 recusa, e o Gradle do
      # Capacitor (AGP 8.7) exige o 21.
      #
      # São dois passos em vez de uma lista para poder referenciar o caminho do
      # 17 pelo output do próprio passo, sem depender do nome da variável que o
      # runner cria. O 21 vem por último e fica como JAVA_HOME padrão, que é o
      # que o Gradle usa.
      - uses: actions/setup-java@v4
        id: jdk17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: NDK para o gomobile
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: make deps
      - name: Conferir os dois JDKs
        run: |
          echo "padrão (Gradle):  $(javac -version 2>&1)"
          echo "gomobile:         $('${{ steps.jdk17.outputs.path }}/bin/javac' -version 2>&1)"
      - run: make android JAVA_HOME_GOMOBILE="${{ steps.jdk17.outputs.path }}"
      - name: Tamanho do APK
        run: ls -l --block-size=M mobile/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iparrot-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 1

  # Só sob demanda (Actions > Build IParrot > Run workflow) ou em tag: é o job
  # mais lento de todos e não produz nada instalável, já que um .ipa exige
  # conta Apple Developer. Serve para saber que o núcleo ainda compila no iOS.
  ios:
    name: iOS (simulador, sem assinatura)
    runs-on: macos-latest
    needs: ui
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            mobile/package-lock.json
      - run: make deps
      - run: make ios
      # Para gerar um .ipa instalável é preciso uma conta Apple Developer:
      # ver docs/BUILD.md, seção "iOS: assinatura e TestFlight".

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    # Por tag, ou pelo campo "versao" ao rodar o workflow à mão. O segundo
    # caminho existe porque nem todo ambiente consegue empurrar tags; o
    # `gh release create` cria a tag junto com o release.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
    # Os anexos de release não entram na cota de armazenamento de artefatos,
    # ao contrário dos artefatos de execução.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: baixados
      - name: Organizar os arquivos
        run: |
          set -eux
          TAG="${{ inputs.versao || github.ref_name }}"
          VERSAO="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p dist
          cp baixados/iparrot-windows-amd64/IParrot.exe   "dist/IParrot-$VERSAO-windows-amd64.exe"
          cp baixados/iparrot-linux-amd64/*.tar.gz        "dist/iparrot-$VERSAO-linux-amd64.tar.gz"
          cp baixados/iparrot-android-debug/*.apk         "dist/IParrot-$VERSAO-android-debug.apk"
          cp baixados/go-sum/go.sum                       "dist/go.sum"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
      - name: Publicar no Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IParrot $TAG" \
            --notes-file .github/RELEASE_NOTES.md
